name: appliq
description: "A new Flutter project."

publish_to: "none"

version: 1.0.8+2

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # Supabase & Auth
  supabase_flutter: ^2.8.3
  google_sign_in: ^6.2.2

  # Configuration & Utilities
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.5.3
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  path_provider: ^2.1.5

  # Icons
  cupertino_icons: ^1.0.8
  video_player: ^2.10.0
  pdf: ^3.11.3
  printing: ^5.14.3
  file_picker: ^11.0.3
  googleapis: ^14.0.0
  googleapis_auth: ^2.0.0
  http: ^1.2.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  cached_network_image: ^3.4.1
  excel: ^4.0.6
  share_plus: 10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/videos/
